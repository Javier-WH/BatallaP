<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Diario de Clases</title>
<style>
  :root {
    --border-medium: 1.6pt solid #000;
    --border-thin: 0.6pt solid #000;
    --header-fill: #E2E8F0;
    --font-main: Cambria, Georgia, 'Times New Roman', serif;
  }

  * { box-sizing: border-box; }

  body {
    font-family: var(--font-main);
    margin: 0;
    padding: 0;
    background: #ddd;
    color: #000;
  }

  /* ---------- On-screen controls (hidden when printing) ---------- */
  #controls {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #1f2937;
    padding: 12px 20px;
    display: flex;
    gap: 12px;
    align-items: center;
    font-family: Arial, sans-serif;
  }
  #controls button {
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 10px 18px;
    font-size: 14px;
    border-radius: 6px;
    cursor: pointer;
    font-family: Arial, sans-serif;
  }
  #controls button:hover { background: #1d4ed8; }
  #controls span { color: #cbd5e1; font-size: 13px; }

  /* ---------- Page ---------- */
  .sheet {
    width: 8.5in;
    min-height: 11in;
    margin: 20px auto;
    background: #fff;
    padding: 0.5in 0.7in 0.3in 0.7in;
    box-shadow: 0 0 8px rgba(0,0,0,0.3);
  }

  .side-container.hidden-side { display: none; }

  /* ---------- Logo + Title row ---------- */
  .doc-title-row {
    position: relative;
    text-align: center;
    font-size: 10pt;
    font-weight: bold;
    height: 15.75pt;
    line-height: 15.75pt;
    margin-bottom: 0;
  }
  .logo-img {
    position: absolute;
    left: 0;
    top: 0;
    width: 0.69in;
    height: 0.69in;
  }

  /* ---------- Class info / Día-Fecha row ---------- */
  .info-block { padding-left: 15.647%; }
  .info-row {
    display: flex;
    justify-content: space-between;
    font-size: 11pt;
    height: 15.75pt;
    line-height: 15.75pt;
  }
  .info-left { font-weight: bold; }
  .info-right { }
  .info-right .label { font-weight: normal; }
  .info-right .value { font-weight: bold; margin-left: 5px; }
  .info-right .date-value { font-weight: normal; font-family: Calibri, Arial, sans-serif; margin-left: 5px; }

  /* ---------- MAÑANA / TARDE banner ---------- */
  .banner {
    text-align: center;
    font-weight: bold;
    font-size: 10pt;
    letter-spacing: 4px;
    height: 15.75pt;
    line-height: 15.75pt;
  }

  /* ---------- Day table ---------- */
  table.day-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    margin-bottom: 0;
  }
  table.day-table th {
    background: var(--header-fill);
    font-size: 8pt;
    font-weight: bold;
    text-align: center;
    padding: 3px 1px;
    line-height: 1.15;
    overflow-wrap: break-word;
    border-top: var(--border-medium);
    border-bottom: var(--border-thin);
    border-left: var(--border-thin);
    border-right: var(--border-thin);
  }
  table.day-table th:first-child { border-left: var(--border-medium); }
  table.day-table th:last-child { border-right: var(--border-medium); }

  table.day-table td {
    font-size: 8pt;
    height: 15pt;
    border-top: var(--border-thin);
    border-bottom: var(--border-thin);
    border-left: var(--border-thin);
    border-right: var(--border-thin);
    text-align: center;
    padding: 0 3px;
  }
  table.day-table td:first-child { border-left: var(--border-medium); white-space: nowrap; }
  table.day-table td:last-child { border-right: var(--border-medium); }
  table.day-table tr:last-child td { border-bottom: var(--border-medium); }

  table.day-table col.col-A { width: 15.647%; }
  table.day-table col.col-B { width: 15.647%; }
  table.day-table col.col-C { width: 15.647%; }
  table.day-table col.col-D { width: 19.63%; }
  table.day-table col.col-E { width: 13.087%; }
  table.day-table col.col-F { width: 20.342%; }

  .gap-8 { height: 8.1pt; }

  /* ---------- Print rules ---------- */
  @media print {
    body { background: #fff; }
    #controls { display: none !important; }
    .sheet {
      margin: 0;
      box-shadow: none;
      width: auto;
      min-height: auto;
      page-break-after: always;
    }
    .sheet:last-child { page-break-after: auto; }
    @page {
      size: letter portrait;
      margin: 0.5in 0.7in 0.3in 0.7in;
    }
  }
</style>
</head>
<body>

<div id="controls">
  <button onclick="printSide(1)">Imprimir Lado 1 (Frente)</button>
  <button onclick="printSide(2)">Imprimir Lado 2 (Reverso)</button>
  <span>Frente: Lunes, Martes, Miércoles (mañana) — Reverso: Miércoles (tarde), Jueves, Viernes</span>
</div>

<div id="side1" class="side-container"></div>

/* ---------- Renderers ---------- */
function renderTable(slots, rowData) {
  const cols = ['A','B','C','D','E','F'].map(c => `<col class="col-${c}">`).join('');
  const thead = `<tr>${HEADERS.map(h => `<th>${h}</th>`).join('')}</tr>`;
  const rows = slots.map((slot, i) => {
    const d = (rowData && rowData[i]) || {};
    return `<tr>
      <td>${slot}</td>
      <td>${d.asignatura || ''}</td>
      <td>${d.inasistentes || ''}</td>
      <td>${d.contenido || ''}</td>
      <td>${d.firma || ''}</td>
      <td>${d.observaciones || ''}</td>
    </tr>`;
  }).join('');
  return `<table class="day-table"><colgroup>${cols}</colgroup><thead>${thead}</thead><tbody>${rows}</tbody></table>`;
}

function renderHeader(level, section, dia) {
  return `<div class="doc-title-row">
      <img class="logo-img" src="${LOGO_SRC}" alt="Logo institucional">
      DIARIO DE CLASES
    </div>
    <div class="info-block">
      <div class="info-row">
        <div class="info-left">${level}</div>
        <div class="info-right"><span class="label">DÍA:</span><span class="value">${dia}</span></div>
      </div>
      <div class="info-row">
        <div class="info-left">SECCIÓN &quot;${section}&quot;</div>
        <div class="info-right"><span class="label">FECHA:</span><span class="date-value">____/____/_______</span></div>
      </div>
    </div>`;
}

function renderDiaFechaRow(dia) {
  return `<div class="info-block">
      <div class="info-row">
        <div class="info-left"></div>
        <div class="info-right"><span class="label">DÍA:</span><span class="value">${dia}</span></div>
      </div>
      <div class="info-row">
        <div class="info-left"></div>
        <div class="info-right"><span class="label">FECHA:</span><span class="date-value">____/____/_______</span></div>
      </div>
    </div>`;
}

function renderDayBlock(dia, { showMorning = true, showAfternoon = true, isFirst = false, level, section } = {}) {
  let out = '';
  out += isFirst ? renderHeader(level, section, dia) : renderDiaFechaRow(dia);
  if (showMorning) {
    out += `<div class="banner">M &nbsp; A &nbsp; Ñ &nbsp; A &nbsp; N &nbsp; A</div>`;
    out += renderTable(MORNING_SLOTS);
  }
  if (showAfternoon) {
    out += `<div class="banner">T &nbsp; A &nbsp; R &nbsp; D &nbsp; E</div>`;
    out += renderTable(AFTERNOON_SLOTS);
  }
  return out;
}

function renderFrontPage(cls) {
  let body = '';
  body += renderDayBlock('LUNES', { isFirst: true, level: cls.level, section: cls.section, showMorning: true, showAfternoon: true });
  body += `<div class="gap-8"></div>`;
  body += renderDayBlock('MARTES', { showMorning: true, showAfternoon: true });
  body += `<div class="gap-8"></div>`;
  body += renderDayBlock('MIÉRCOLES', { showMorning: true, showAfternoon: false });
  return `<div class="sheet">${body}</div>`;
}

function renderBackPage(cls) {
  let body = '';
  body += renderDayBlock('MIÉRCOLES', { isFirst: true, level: cls.level, section: cls.section, showMorning: false, showAfternoon: true });
  body += `<div class="gap-8"></div>`;
  body += renderDayBlock('JUEVES', { showMorning: true, showAfternoon: true });
  body += `<div class="gap-8"></div>`;
  body += renderDayBlock('VIERNES', { showMorning: true, showAfternoon: true });
  return `<div class="sheet">${body}</div>`;
}

function renderAll() {
  document.getElementById('side1').innerHTML = CLASSES.map(renderFrontPage).join('');
  document.getElementById('side2').innerHTML = CLASSES.map(renderBackPage).join('');
}

function printSide(n) {
  document.getElementById('side1').classList.toggle('hidden-side', n !== 1);
  document.getElementById('side2').classList.toggle('hidden-side', n !== 2);
  window.print();
}

renderAll();
</script>

</body>
</html>
